<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Your Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/*──────────────────────────────────────────
  TOKENS
──────────────────────────────────────────*/
:root {
  --bg:        #F6F6F4;
  --surface:   #FFFFFF;
  --ink-1:     #111111;
  --ink-2:     #555552;
  --ink-3:     #999994;
  --rule:      #E0E0DC;
  --blue:      #1B3FA0;
  --blue-pale: #EEF2FF;
  --radius:    6px;
  --ease:      cubic-bezier(.22,.68,0,1.2);
}

/*──────────────────────────────────────────
  RESET
──────────────────────────────────────────*/
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink-1);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { display: block; width: 100%; height: 100%; object-fit: cover; }

/*──────────────────────────────────────────
  HEADER
──────────────────────────────────────────*/
header {
  max-width: 1200px;
  margin: 0 auto;
  padding: 64px 32px 40px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.header-left h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 6px;
}
.header-left p {
  font-size: 0.95rem;
  font-weight: 300;
  color: var(--ink-2);
  max-width: 440px;
}
.header-links {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
}
.header-links a {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--ink-2);
  text-decoration: none;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: color .2s;
}
.header-links a:hover { color: var(--blue); }

/* Animated rule — the signature element */
.axis-rule {
  max-width: 1200px;
  margin: 0 auto 0;
  padding: 0 32px;
}
.axis-rule-inner {
  height: 2px;
  background: var(--blue);
  width: 0;
  animation: drawRule 0.9s var(--ease) 0.2s forwards;
}
@keyframes drawRule {
  to { width: 100%; }
}

/*──────────────────────────────────────────
  FILTER BAR
──────────────────────────────────────────*/
.filter-bar {
  max-width: 1200px;
  margin: 28px auto 0;
  padding: 0 32px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  padding: 5px 14px;
  border: 1.5px solid var(--rule);
  border-radius: 99px;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .18s;
  letter-spacing: 0.03em;
}
.filter-btn:hover {
  border-color: var(--blue);
  color: var(--blue);
}
.filter-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

/*──────────────────────────────────────────
  GALLERY GRID
──────────────────────────────────────────*/
.gallery {
  max-width: 1200px;
  margin: 24px auto 80px;
  padding: 0 32px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 900px) {
  .gallery { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 580px) {
  .gallery { grid-template-columns: 1fr; }
  header { padding: 40px 20px 28px; }
  .axis-rule { padding: 0 20px; }
  .filter-bar { padding: 0 20px; }
  .gallery { padding: 0 20px; }
}

/*──────────────────────────────────────────
  TILE
──────────────────────────────────────────*/
.tile {
  position: relative;
  aspect-ratio: 4 / 3;
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  transition: box-shadow .25s, transform .25s var(--ease), opacity .35s;
}
.tile:hover {
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  transform: translateY(-3px);
}
.tile.span-2 { grid-column: span 2; aspect-ratio: 2 / 1; }
@media (max-width: 580px) { .tile.span-2 { grid-column: span 1; aspect-ratio: 4/3; } }

.tile img { transition: transform .5s var(--ease); }
.tile:hover img { transform: scale(1.04); }

/* Interactive badge */
.tile-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  background: rgba(27,63,160,.85);
  color: #fff;
  border-radius: 3px;
  backdrop-filter: blur(4px);
}

/* Overlay on hover */
.tile-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10,10,20,.72) 0%, rgba(10,10,20,0) 50%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 18px;
  opacity: 0;
  transition: opacity .3s;
}
.tile:hover .tile-overlay { opacity: 1; }
.tile-overlay-cat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  color: rgba(255,255,255,.65);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.tile-overlay-title {
  font-size: 0.92rem;
  font-weight: 500;
  color: #fff;
  line-height: 1.3;
}

/* Filter fade */
.tile.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.97);
}

/*──────────────────────────────────────────
  MODAL BACKDROP
──────────────────────────────────────────*/
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 8, 14, 0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s;
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: all;
}

/*──────────────────────────────────────────
  MODAL PANEL
──────────────────────────────────────────*/
.modal {
  background: var(--surface);
  border-radius: 10px;
  width: 100%;
  max-width: 860px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 32px 80px rgba(0,0,0,.4);
  transform: scale(0.96) translateY(12px);
  transition: transform .3s var(--ease);
  outline: none;
}
.modal-backdrop.open .modal {
  transform: scale(1) translateY(0);
}

.modal-media {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #0a0a0e;
  border-radius: 10px 10px 0 0;
  overflow: hidden;
  position: relative;
}
.modal-media img {
  object-fit: contain;
  background: #0a0a0e;
}
.modal-media iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.modal-body {
  padding: 28px 32px 36px;
}
.modal-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.modal-category {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--blue);
}
.modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.55rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.25;
  margin-bottom: 14px;
}
.modal-desc {
  font-size: 0.9rem;
  font-weight: 300;
  color: var(--ink-2);
  line-height: 1.75;
  margin-bottom: 20px;
}
.modal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.modal-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  padding: 3px 10px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: none;
  color: #fff;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .18s;
  z-index: 2;
}
.modal-close:hover { background: rgba(255,255,255,.24); }

/*──────────────────────────────────────────
  EMPTY STATE
──────────────────────────────────────────*/
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 60px 0;
  color: var(--ink-3);
  font-size: 0.9rem;
  display: none;
}

/*──────────────────────────────────────────
  FOOTER
──────────────────────────────────────────*/
footer {
  border-top: 1px solid var(--rule);
  padding: 24px 32px;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
footer p {
  font-size: 0.78rem;
  color: var(--ink-3);
}
</style>
</head>
<body>

<!--─────────────────────────────────

    interactive — true = show an iframe in the modal; false = show a full image

<!-- ── HEADER ───────────────────────────── -->
<header>
  <div class="header-left">
    <!-- ↓ Change to your name and bio -->
    <h1>Elye Bliss</h1>
    <p>Data scientist working in population health, economics, linguistics, and volunteer projects.</p>
  </div>
  <nav class="header-links">
    <!-- ↓ Update href values -->
    <a href="https://github.com/elyeb" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/in/elye-bliss" target="_blank">LinkedIn</a>
  </nav>
</header>

<div class="axis-rule"><div class="axis-rule-inner"></div></div>

<!-- ── FILTER BAR ─────────────────────── -->
<div class="filter-bar" id="filterBar"></div>

<!-- ── GALLERY ────────────────────────── -->
<main class="gallery" id="gallery">
  <div class="empty" id="emptyMsg">No items in this category yet.</div>
</main>

<!-- ── MODAL ──────────────────────────── -->
<div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modal" tabindex="-1">
    <div class="modal-media" id="modalMedia">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-meta">
        <span class="modal-category" id="modalCategory"></span>
      </div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-tags" id="modalTags"></div>
    </div>
  </div>
</div>

<!-- ── FOOTER ─────────────────────────── -->
<footer>
  <p>© 2026 · Built with vanilla HTML/CSS/JS · Hosted on GitHub Pages</p>
  <p style="color:var(--ink-3);font-size:.75rem">Click any tile to read more</p>
</footer>

<script>
// ── BUILD FILTER BUTTONS ──────────────────────────────────────────────────
const filterBar = document.getElementById('filterBar');
let active = 'All';

CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
  btn.textContent = cat;
  btn.addEventListener('click', () => {
    active = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterGallery();
  });
  filterBar.appendChild(btn);
});

// ── BUILD TILES ───────────────────────────────────────────────────────────
const gallery = document.getElementById('gallery');

PORTFOLIO.forEach((item, idx) => {
  const tile = document.createElement('div');
  tile.className = 'tile' + (item.span === 2 ? ' span-2' : '');
  tile.dataset.category = item.category;
  tile.tabIndex = 0;
  tile.setAttribute('role', 'button');
  tile.setAttribute('aria-label', 'View: ' + item.title);

  tile.innerHTML = `
    <img src="${item.thumbnail}" alt="${item.title}" loading="lazy">
    ${item.interactive ? '<span class="tile-badge">interactive</span>' : ''}
    <div class="tile-overlay">
      <div class="tile-overlay-cat">${item.category}</div>
      <div class="tile-overlay-title">${item.title}</div>
    </div>
  `;

  tile.addEventListener('click', () => openModal(item));
  tile.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(item); });
  gallery.appendChild(tile);
});

// ── FILTER ────────────────────────────────────────────────────────────────
function filterGallery() {
  const tiles = document.querySelectorAll('.tile');
  let visible = 0;
  tiles.forEach(tile => {
    const show = active === 'All' || tile.dataset.category === active;
    tile.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('emptyMsg').style.display = visible === 0 ? 'block' : 'none';
}

// ── MODAL ─────────────────────────────────────────────────────────────────
const backdrop  = document.getElementById('backdrop');
const modal     = document.getElementById('modal');
const modalMedia = document.getElementById('modalMedia');

function openModal(item) {
  // clear previous media
  const prevMedia = modalMedia.querySelector('img, iframe');
  if (prevMedia) prevMedia.remove();

  if (item.interactive) {
    const noIframeDomains = ["powerbi.com", "streamlit.app", "share.streamlit.io"];
    const needsNewTab = noIframeDomains.some(domain => item.mediaSrc.includes(domain));

    if (needsNewTab) {
      window.open(item.mediaSrc, "_blank");
    } else {
      const iframe = document.createElement('iframe');
      iframe.src = item.mediaSrc;
      iframe.title = item.title;
      iframe.allow = "fullscreen";
      modalMedia.appendChild(iframe);
    }
  } else {
    const img = document.createElement('img');
    img.src = item.mediaSrc;
    img.alt = item.title;
    modalMedia.appendChild(img);
  }

  document.getElementById('modalCategory').textContent = item.category;
  document.getElementById('modalTitle').textContent = item.title;
  document.getElementById('modalDesc').textContent = item.description;

  const tagContainer = document.getElementById('modalTags');
  tagContainer.innerHTML = '';
  item.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'modal-tag';
    span.textContent = t;
    tagContainer.appendChild(span);
  });

  backdrop.classList.add('open');
  modal.focus();
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
  // remove iframe to stop any embedded video/audio
  setTimeout(() => {
    const iframe = modalMedia.querySelector('iframe');
    if (iframe) iframe.remove();
  }, 300);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Trap focus inside modal when open
modal.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const focusable = modal.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
    e.preventDefault();
    (e.shiftKey ? last : first).focus();
  }
});

// Respect reduced motion preference
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelector('.axis-rule-inner').style.animation = 'none';
  document.querySelector('.axis-rule-inner').style.width = '100%';
}
</script>
</body>
